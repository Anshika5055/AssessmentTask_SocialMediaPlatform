<div class="engagement-container">
  <h1>User Engagement Scores</h1>
  
  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="userEngagements" class="engagement-table">
        <ng-container matColumnDef="userName">
          <th mat-header-cell *matHeaderCellDef>User Name</th>
          <td mat-cell *matCellDef="let engagement">{{ engagement.user.userName }}</td>
        </ng-container>

        <ng-container matColumnDef="posts">
          <th mat-header-cell *matHeaderCellDef>Posts</th>
          <td mat-cell *matCellDef="let engagement">{{ engagement.posts }}</td>
        </ng-container>

        <ng-container matColumnDef="likes">
          <th mat-header-cell *matHeaderCellDef>Likes</th>
          <td mat-cell *matCellDef="let engagement">{{ engagement.likes }}</td>
        </ng-container>

        <ng-container matColumnDef="comments">
          <th mat-header-cell *matHeaderCellDef>Comments</th>
          <td mat-cell *matCellDef="let engagement">{{ engagement.comments }}</td>
        </ng-container>

        <ng-container matColumnDef="score">
          <th mat-header-cell *matHeaderCellDef>Engagement Score</th>
          <td mat-cell *matCellDef="let engagement">
            <strong>{{ engagement.score }}</strong>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>

  <div class="info-section">
    <p><strong>Engagement Score Formula:</strong></p>
    <p>Score = (Posts × 5) + (Likes × 2) + (Comments × 3)</p>
  </div>
</div>
